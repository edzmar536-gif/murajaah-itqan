name: Bina APK dan web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bina
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Buka fail projek
        run: unzip -o murajaah-itqan-projek.zip -d .

      - name: Kunci tandatangan rahsia (jika ada)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Bina APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MurajaahItqan
          path: MurajaahItqan.apk

      - name: Terbitkan APK ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: Murajaah Itqan v2.${{ github.run_number }}
          body: Muat turun MurajaahItqan.apk di bawah dan pasang di fon Android. Web app ada di halaman GitHub Pages repo ini.
          files: MurajaahItqan.apk
          make_latest: true

      - name: Sediakan web app
        run: bash build-web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
        
